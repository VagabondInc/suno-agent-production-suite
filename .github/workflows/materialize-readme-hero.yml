name: Materialize README hero

on:
  push:
    paths:
      - '.github/workflows/materialize-readme-hero.yml'
      - 'assets/readme-hero.webp.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode generated hero image
        shell: bash
        run: |
          base64 --decode assets/readme-hero.webp.b64 > assets/readme-hero.webp
          rm -f assets/readme-hero.webp.b64
          rm -f assets/README-HERO-NOTE.txt
          rm -f assets/hero-preview-link.txt

      - name: Commit generated hero asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Add generated README hero banner"
          git push
